resources:
  genie_spaces:
    healthcare_finance_intelligence:
      title: "Healthcare Finance Intelligence"
      description: "Genie Agent for healthcare finance analytics — MLR trending, HEDIS quality measures, VBC performance, and avoidable spend. Webinar demo Sep 2026."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6",
                "question": [
                  "Give me my morning briefing — what needs attention today across our financial performance, quality measures, and care management? Flag anything that's off track."
                ]
              },
              {
                "id": "a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2",
                "question": [
                  "Prepare a brief for my meeting with Dr. Chen — key talking points and what I should raise."
                ]
              },
              {
                "id": "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a7",
                "question": [
                  "Tell me more about the quality measures at risk. Which HEDIS measures are below 4-star cutpoints for our MA population, and what's the gap count?"
                ]
              },
              {
                "id": "c3d4e5f6a7b8c9d0e1f2a3b4c5d6a7b8",
                "question": [
                  "Show me the top 10 highest-risk members with the most open care gaps. What are the recommended interventions?"
                ]
              },
              {
                "id": "d4e5f6a7b8c9d0e1f2a3b4c5d6a7b8c9",
                "question": [
                  "How many of those high-risk members are in states with high avoidable ED rates? Is there a pattern?"
                ]
              },
              {
                "id": "e5f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0",
                "question": [
                  "Tell me about Accountable Health Partners. What's their value-based care performance — shared savings, quality scores, and cost trends?"
                ]
              },
              {
                "id": "f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1",
                "question": [
                  "What's driving the TCOC increase at AHP? Is it pharmacy?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.dim_aco_contract"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.dim_budget"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.dim_member"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.dim_provider_network"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.fact_vbc_performance"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.gold_financial_monthly"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.gold_quality_measures"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.gold_utilization_monthly"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_budget_variance"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_financial"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_member_risk"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_quality"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_utilization"
              },
              {
                "identifier": "${resources.schemas.healthcare_finance.catalog_name}.${resources.schemas.healthcare_finance.name}.mv_vbc_performance"
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "01a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6",
                "content": [
                  "DOMAIN CONTEXT\n\nGainsharing = distribution of shared savings to providers. AHP split: 60% PCPs, 25% specialists, 15% hospitals.\n\nBEHAVIORAL RULES\n\n1. Always query metric views for KPIs. Six governed views are available: mv_financial (MLR, PMPM, avoidable spend), mv_quality (HEDIS rates, star cutpoints, gap closure), mv_vbc_performance (shared savings, TCOC, quality score — includes ACO name via join), mv_utilization (per-1K rates: IP, ED, readmission, avoidable rates), mv_budget_variance (actual vs target MLR, premium/claims variance, budget attainment), mv_member_risk (risk stratification, high-risk counts, care gap rates by risk tier). Do not query raw gold_ or dim_ tables for aggregate metrics when a metric view covers the KPI.\n2. When comparing across LOBs, always normalize per member-month (use PMPM measures, not raw sums).\n3. \"How is X trending\" → render a monthly time series using year_month dimension.\n4. When discussing financial performance vs budget, query mv_budget_variance for actual_mlr, target_mlr, mlr_variance, and budget_attainment by LOB and month. Do NOT manually join dim_budget.\n5. For VBC questions, query mv_vbc_performance — it already joins dim_aco_contract and exposes aco_name, contract_type, and region as dimensions. Use the typed measures: shared_savings_ytd (SUM), tcoc_pmpm (AVG), quality_score (AVG), readmission_rate (AVG), ed_rate_per_1k (AVG), pharmacy_pmpm (AVG).\n6. For quality questions, query mv_quality. Use MEASURE(distance_to_4_star) to show how far each measure is from the 4-star cutpoint. Use the estimated_star_rating derived dimension to bucket measures into star ratings. Flag any measure where distance_to_4_star < 0.\n7. \"Top members\" or \"drill to members\" → return at most 10 rows from dim_member. Never expose member_id in results — use for filtering only. For population-level risk stats, query mv_member_risk by risk_tier dimension (Low/Moderate/High/Very High).\n8. When asked about \"AHP\" or \"Accountable Health Partners,\" query mv_vbc_performance for aco_id = 'ACO-001'. The view already exposes ACO name, region, and contract type.\n9. When asked to prepare a \"brief,\" \"talking points,\" or anything related to a \"meeting\" with Dr. Chen or AHP leadership, SYNTHESIZE a structured meeting brief using live data. Query mv_vbc_performance for shared savings YTD, TCOC trend, and pharmacy PMPM; query mv_quality for HbA1c (CDC-HBA1C) and BCS rates vs 4-star cutpoints. Present the response as numbered talking points: (1) Shared savings YTD vs benchmark, (2) Quality measures at risk — HbA1c and BCS gap to 4-star, (3) Pharmacy/GLP-1 cost pressure on TCOC, (4) Recommended asks or discussion items. The Executive Medical Director is Dr. Sarah Chen (ACO-001, Accountable Health Partners, Finger Lakes / Upstate NY). Do NOT decline to generate a brief — the metric views contain all the data needed.\n10. When asked for a \"morning briefing\" or \"what needs attention,\" prioritize: (a) LOBs with MLR > 1.0 from mv_budget_variance, (b) quality measures below 4-star cutpoint from mv_quality (distance_to_4_star < 0), (c) states with highest avoidable ED/IP rates from mv_utilization.\n11. For utilization questions (ED visits, readmissions, avoidable admissions), query mv_utilization for per-1K rates by LOB and state. Do not compute rates manually from raw counts.\n12. All data is synthetic. If asked, acknowledge this is demo data for illustration purposes.\n\nMEASURE() SYNTAX REMINDER\n\nMetric views require MEASURE() function for all measures. Examples:\n\n  SELECT lob, MEASURE(mlr), MEASURE(paid_pmpm) FROM mv_financial WHERE year_month = '2026-05-01' GROUP BY ALL\n\n  SELECT measure_name, lob, MEASURE(current_rate), MEASURE(star_4_cutpoint), MEASURE(distance_to_4_star) FROM mv_quality WHERE lob = 'MA' AND year_month = '2026-05-01' GROUP BY ALL\n\n  SELECT aco_name, MEASURE(shared_savings_ytd), MEASURE(tcoc_pmpm), MEASURE(pharmacy_pmpm) FROM mv_vbc_performance WHERE aco_id = 'ACO-001' AND quarter = '2026-Q3' GROUP BY ALL\n\n  SELECT state, MEASURE(ed_per_1k), MEASURE(avoidable_ed_rate) FROM mv_utilization WHERE lob = 'Medicaid' AND year_month = '2026-05-01' GROUP BY ALL\n\n  SELECT lob, MEASURE(actual_mlr), MEASURE(target_mlr), MEASURE(mlr_variance) FROM mv_budget_variance WHERE year_month = '2026-05-01' GROUP BY ALL\n\n  SELECT risk_tier, lob, MEASURE(member_count), MEASURE(high_risk_pct), MEASURE(avg_open_gaps) FROM mv_member_risk GROUP BY ALL\n\nDo NOT use JOINs with metric views. If you need to combine metric view data with dimension tables, query them separately and present results together."
                ]
              }
            ]
          }
        }
      permissions:
        - level: CAN_RUN
          group_name: users
