# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "fhcf-demo"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    default: hls_fde
  schema:
    default: healthcare_finance

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
    variables:
      catalog: hls_fde_dev
      
  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      # We always use /Users/matthew.giglia@databricks.com for all resources to make sure we only have a single copy.
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as matthew.giglia@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: matthew.giglia@databricks.com
    # Prod-only resources — not deployed to dev.
    resources:
      jobs:
        certify_register:
          name: "[FHCF] Certify & Register Domain Assets"
          parameters:
            - name: certify_assets
              default: "false"
          tasks:
            - task_key: should_certify
              condition_task:
                op: EQUAL_TO
                left: "{{job.parameters.certify_assets}}"
                right: "true"
            - task_key: certify_prod_assets
              depends_on:
                - task_key: should_certify
                  outcome: "true"
              notebook_task:
                notebook_path: ./src/certify_and_register.py
                base_parameters:
                  mode: "certify"
                  catalog: ${resources.schemas.healthcare_finance.catalog_name}
                  schema: ${resources.schemas.healthcare_finance.name}
                  domain_name: "mkgs_hc_finance"
                  cfo_dashboard_id: ${resources.dashboards.cfo_executive_dashboard.id}
                  cmo_dashboard_id: ${resources.dashboards.health_plan_cmo_performance.id}
                  genie_space_id: ${resources.genie_spaces.healthcare_finance_intelligence.id}
            - task_key: register_and_setup
              depends_on:
                - task_key: certify_prod_assets
                - task_key: should_certify
                  outcome: "false"
              run_if: AT_LEAST_ONE_SUCCESS
              notebook_task:
                notebook_path: ./src/certify_and_register.py
                base_parameters:
                  mode: "register"
                  catalog: ${resources.schemas.healthcare_finance.catalog_name}
                  schema: ${resources.schemas.healthcare_finance.name}
                  domain_name: "mkgs_hc_finance"
                  cfo_dashboard_id: ${resources.dashboards.cfo_executive_dashboard.id}
                  cmo_dashboard_id: ${resources.dashboards.health_plan_cmo_performance.id}
                  genie_space_id: ${resources.genie_spaces.healthcare_finance_intelligence.id}
            # Genie Code task — creates UC Pages for the domain.
            # BLOCKED: genie_task is not yet in the bundle CLI schema (fails --strict).
            # The task value plumbing is ready — uncomment when CLI supports genie_task.
            # The register_and_setup notebook creates the automation idempotently
            # and emits the configuration_id as a task value.
            #
            # - task_key: create_domain_pages
            #   depends_on:
            #     - task_key: register_and_setup
            #   genie_task:
            #     configuration_id: "{{tasks.register_and_setup.values.genie_pages_automation_id}}"
            #     parameters:
            #       domain_name: "mkgs_hc_finance"
            #       catalog: "{{tasks.register_and_setup.values.catalog}}"
            #       schema: "{{tasks.register_and_setup.values.schema}}"
          queue:
            enabled: true

